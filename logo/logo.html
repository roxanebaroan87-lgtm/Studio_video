<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Logo By Lau</title>
<style>
@font-face { font-family: Bodoni; src: url(fonts/bodoni-moda-latin-400-normal.woff2); font-weight: 400; }
@font-face { font-family: Bodoni; src: url(fonts/bodoni-moda-latin-400-italic.woff2); font-weight: 400; font-style: italic; }
@font-face { font-family: Cormorant; src: url(fonts/cormorant-garamond-latin-300-italic.woff2); font-weight: 300; font-style: italic; }
@font-face { font-family: Cormorant; src: url(fonts/cormorant-garamond-latin-500-normal.woff2); font-weight: 500; }
@font-face { font-family: Josefin; src: url(fonts/josefin-sans-latin-300-normal.woff2); font-weight: 300; }
:root { --bdx: #5A0A17; --ink: var(--bdx); --line: rgba(90, 10, 23, .42); }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: transparent; }
body { overflow: hidden; }
.page { position: relative; overflow: hidden; }
.dark { --ink: #FFFFFF; --line: rgba(255, 255, 255, .45); }
svg text { fill: var(--ink); }
.by { font-family: Cormorant; font-style: italic; font-weight: 300; }
.lau { font-family: Bodoni; font-weight: 400; }
.sans { font-family: Josefin; font-weight: 300; }
.serif { font-family: Cormorant; font-weight: 500; }
</style></head>
<body>
<div class="page" id="page"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
<script>
const v = new URLSearchParams(location.search).get('v') || 'presentation';
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('svg'), page = document.getElementById('page');
const BDX = '#5A0A17';
const mk = (tag, attrs, parent = svg, text) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  parent.appendChild(e); return e;
};
const size = (w, h) => { page.style.width = w + 'px'; page.style.height = h + 'px'; svg.setAttribute('width', w); svg.setAttribute('height', h); svg.setAttribute('viewBox', `0 0 ${w} ${h}`); };

// ---------- logo principal : "by" / "Lau" + ENTREPRISE vertical + arc ----------
function mainLogo(g, opt = {}) {
  const by = mk('text', { class: 'by', 'font-size': 330, x: 0, y: 0 }, g, 'by');
  const lau = mk('text', { class: 'lau', 'font-size': 330, 'letter-spacing': -6, x: 0, y: 0 }, g, 'Lau');
  // placement : "by" au-dessus, décalé ; "Lau" en dessous, légère superposition
  const bb = by.getBBox();
  lau.setAttribute('x', 0); lau.setAttribute('y', 560);
  by.setAttribute('x', 150); by.setAttribute('y', 300);
  const lb = lau.getBBox(), b2 = by.getBBox();
  // filet + ENTREPRISE vertical
  const xr = lb.x + lb.width + 46;
  const top = b2.y + 40, bottom = lb.y + lb.height - 8;
  mk('line', { x1: xr, y1: top, x2: xr, y2: bottom, stroke: 'var(--line)', 'stroke-width': 1.6 }, g);
  const vert = mk('g', { transform: `translate(${xr + 30} ${top}) rotate(90)` }, g);
  const ent = mk('text', { class: 'sans', 'font-size': 44, 'letter-spacing': 0, x: 0, y: 0 }, vert, 'ENTREPRISE');
  // espacer les lettres pour remplir la hauteur du filet
  const len = bottom - top, w0 = ent.getComputedTextLength();
  ent.setAttribute('letter-spacing', Math.max(4, (len - w0) / 9.6));
  ent.setAttribute('y', 0);
  // arc "bienvenue chez vous" autour du "b"
  const cx = b2.x + 95, cy = b2.y + b2.height * .5, r = b2.height * .6;
  const a0 = 185 * Math.PI / 180, a1 = 330 * Math.PI / 180;
  const p = `M ${cx + r * Math.cos(a0)} ${cy + r * Math.sin(a0)} A ${r} ${r} 0 0 1 ${cx + r * Math.cos(a1)} ${cy + r * Math.sin(a1)}`;
  const id = 'arc' + Math.random().toString(36).slice(2);
  mk('path', { id, d: p, fill: 'none' }, g);
  const t = mk('text', { class: 'sans', 'font-size': 38, 'letter-spacing': 6 }, g);
  mk('textPath', { href: '#' + id, startOffset: '50%', 'text-anchor': 'middle' }, t, 'bienvenue chez vous');
  // petit losange
  return g.getBBox();
}

function center(g, w, h, dx = 0, dy = 0) {
  const b = g.getBBox();
  g.setAttribute('transform', `translate(${(w - b.width) / 2 - b.x + dx} ${(h - b.height) / 2 - b.y + dy})`);
}

// ---------- monogramme rond ----------
function monogram(g, R) {
  mk('circle', { cx: 0, cy: 0, r: R, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 2.2 }, g);
  mk('circle', { cx: 0, cy: 0, r: R - 14, fill: 'none', stroke: 'var(--line)', 'stroke-width': 1 }, g);
  mk('circle', { cx: 0, cy: 0, r: R * .62, fill: 'none', stroke: 'var(--line)', 'stroke-width': 1 }, g);
  const id = 'c' + Math.random().toString(36).slice(2);
  const rr = R * .81;
  mk('path', { id, d: `M ${-rr} 0 A ${rr} ${rr} 0 1 1 ${rr} 0 A ${rr} ${rr} 0 1 1 ${-rr} 0`, fill: 'none' }, g);
  const t = mk('text', { class: 'sans', 'font-size': R * .1, 'letter-spacing': R * .028 }, g);
  mk('textPath', { href: '#' + id, startOffset: '0%' }, t, 'BY LAU  ✦  ENTREPRISE  ✦  BIENVENUE CHEZ VOUS  ✦ ');
  // ajuster pour faire tout le tour
  const L = 2 * Math.PI * rr, l0 = t.getComputedTextLength(), n = t.textContent.length;
  t.setAttribute('letter-spacing', R * .028 + (L - l0) / n);
  g.querySelector('textPath').setAttribute('startOffset', '-1%');
  const B = mk('text', { class: 'lau', 'font-size': R * .78, 'text-anchor': 'middle', x: -R * .14, y: R * .26 }, g, 'B');
  const Lt = mk('text', { class: 'by', 'font-size': R * .86, 'text-anchor': 'middle', x: R * .2, y: R * .34 }, g, 'L');
}

function band(w, h, bw, color) { mk('rect', { x: w - bw, y: 0, width: bw, height: h, fill: color }); }

// ---------- fond luxe : drapé de satin + reflets + pétales de rose ----------
function rnd(i) { const x = Math.sin(i * 91.7 + 13.3) * 43758.5453; return x - Math.floor(x); }
function luxeBackground(w, h, dark) {
  const defs = mk('defs', {});
  // satin
  const f = mk('filter', { id: 'satin', x: 0, y: 0, width: '100%', height: '100%', 'color-interpolation-filters': 'sRGB' }, defs);
  mk('feTurbulence', { type: 'fractalNoise', baseFrequency: '0.0011 0.0052', numOctaves: 3, seed: 11, result: 'n' }, f);
  const li = mk('feDiffuseLighting', { in: 'n', surfaceScale: 34, diffuseConstant: 1.05, 'lighting-color': '#fff', result: 'l' }, f);
  mk('feDistantLight', { azimuth: 225, elevation: 42 }, li);
  mk('feGaussianBlur', { stdDeviation: 5 }, f);
  mk('feColorMatrix', { type: 'matrix', values: dark
    ? '.62 0 0 0 .02  .05 0 0 0 0  .10 0 0 0 .02  0 0 0 1 0'
    : '.14 0 0 0 .86  .26 0 0 0 .72  .26 0 0 0 .71  0 0 0 1 0' }, f);
  // flous
  [3, 8, 16, 28].forEach(s => { const b = mk('filter', { id: 'b' + s, x: '-50%', y: '-50%', width: '200%', height: '200%' }, defs); mk('feGaussianBlur', { stdDeviation: s }, b); });
  // dégradés pétales
  const pg = (id, c1, c2) => { const g = mk('radialGradient', { id, cx: '35%', cy: '40%', r: '75%' }, defs); mk('stop', { offset: 0, 'stop-color': c1 }, g); mk('stop', { offset: 1, 'stop-color': c2 }, g); };
  pg('petalR', '#A3192F', '#4A0612'); pg('petalW', '#FFFFFF', '#EBD9D6'); pg('petalP', '#E7B9BF', '#B9707C');
  const vg = mk('radialGradient', { id: 'vign', cx: '50%', cy: '48%', r: '75%' }, defs);
  mk('stop', { offset: .55, 'stop-color': dark ? '#000' : '#fff', 'stop-opacity': 0 }, vg);
  mk('stop', { offset: 1, 'stop-color': dark ? '#1a0005' : '#5A0A17', 'stop-opacity': dark ? .7 : .18 }, vg);
  const glow = mk('radialGradient', { id: 'glow', cx: '50%', cy: '50%', r: '50%' }, defs);
  mk('stop', { offset: 0, 'stop-color': '#fff', 'stop-opacity': dark ? .22 : .75 }, glow);
  mk('stop', { offset: 1, 'stop-color': '#fff', 'stop-opacity': 0 }, glow);

  const bg = mk('g', {});
  mk('rect', { width: w, height: h, fill: dark ? '#3A0510' : '#F3E6E3' }, bg);
  const sat = mk('g', { transform: `rotate(-24 ${w / 2} ${h / 2})` }, bg);
  mk('rect', { x: -w * .6, y: -h * .6, width: w * 2.2, height: h * 2.2, filter: 'url(#satin)' }, sat);
  // halo de lumière derrière le logo
  mk('ellipse', { cx: w * .46, cy: h * .5, rx: w * .55, ry: h * .42, fill: 'url(#glow)' }, bg);
  // reflets bokeh
  for (let i = 0; i < 26; i++) {
    const r = 14 + rnd(i) * 60, x = rnd(i + 40) * w, y = rnd(i + 80) * h;
    mk('circle', { cx: x, cy: y, r, fill: dark ? '#FFD9DF' : '#FFFFFF', opacity: (dark ? .07 : .35) + rnd(i + 5) * .25, filter: `url(#b${r > 45 ? 16 : 8})` }, bg);
  }
  // pétales (profondeur de champ : grands = flous, petits = nets)
  const petal = 'M0 0 C 26 -46, 96 -50, 118 -6 C 126 18, 92 46, 52 40 C 26 36, 8 20, 0 0 Z';
  const spots = [[.06, .1, 1.9, 28, 'R'], [.0, .78, 2.3, 28, 'R'], [.78, .93, 2.0, 16, 'R'], [.2, .95, 1.1, 8, 'P'], [.72, .05, 1.3, 16, 'P'],
                 [.15, .22, .7, 3, 'R'], [.62, .86, .6, 3, 'R'], [.08, .62, .55, 3, 'W'], [.55, .14, .5, 3, 'R'], [.86, .4, .8, 8, 'W'], [.33, .88, .45, 3, 'P'], [.9, .7, .5, 3, 'R']];
  spots.forEach(([x, y, s, bl, c], i) => {
    const g = mk('g', { transform: `translate(${x * w} ${y * h}) rotate(${rnd(i) * 360}) scale(${s})`, filter: `url(#b${bl})`, opacity: dark && c === 'R' ? .75 : .92 }, bg);
    mk('path', { d: petal, fill: `url(#petal${dark && c === 'R' ? 'P' : c})` }, g);
    mk('path', { d: 'M8 2 C 40 -10, 80 -14, 108 -4', stroke: '#fff', 'stroke-opacity': .25, 'stroke-width': 3, fill: 'none' }, g);
  });
  // voile (comme le lavis blanc du modèle) + vignettage + cadre fin
  mk('rect', { width: w, height: h, fill: dark ? '#2A0009' : '#FFFFFF', opacity: dark ? .28 : .42 }, bg);
  mk('rect', { width: w, height: h, fill: 'url(#vign)' }, bg);
  mk('rect', { x: 38, y: 38, width: w - 76, height: h - 76, fill: 'none', stroke: dark ? '#fff' : '#5A0A17', 'stroke-opacity': dark ? .35 : .28, 'stroke-width': 1.2 }, bg);
  mk('rect', { x: 50, y: 50, width: w - 100, height: h - 100, fill: 'none', stroke: dark ? '#fff' : '#5A0A17', 'stroke-opacity': dark ? .18 : .14, 'stroke-width': .8 }, bg);
  return bg;
}

function luxe(w, h, dark, withBand) {
  size(w, h);
  if (dark) page.classList.add('dark');
  luxeBackground(w, h, dark);
  const area = withBand ? w - 108 : w;
  if (withBand) band(w, h, 108, BDX);
  const g = mk('g', {}); mainLogo(g);
  const b = g.getBBox(); const s = Math.min((area * .72) / b.width, (h * .6) / b.height);
  g.setAttribute('transform', `translate(${area / 2 - (b.x + b.width / 2) * s} ${h / 2 - (b.y + b.height / 2) * s}) scale(${s})`);
  // logo légèrement transparent : le fond se devine à travers les lettres
  g.style.opacity = dark ? .9 : .88;
  g.style.mixBlendMode = dark ? 'screen' : 'multiply';
}

document.fonts.ready.then(() => {
  if (v === 'luxe-clair') { luxe(1080, 1350, false, true); window.READY = true; return; }
  if (v === 'luxe-bordeaux') { luxe(1080, 1350, true, false); window.READY = true; return; }
  if (v === 'luxe-carre') { luxe(1080, 1080, false, false); window.READY = true; return; }
  if (v === 'luxe-story') { luxe(1080, 1920, true, false); window.READY = true; return; }
  if (v === 'presentation') {
    size(1080, 1350);
    page.style.background = 'radial-gradient(110% 80% at 30% 35%, #FFFFFF 0%, #F7EFEB 58%, #EEE0DA 100%)';
    band(1080, 1350, 108, BDX);
    const g = mk('g', {}); mainLogo(g); center(g, 972, 1350, 0, -10);
  } else if (v === 'logo') {               // transparent, bordeaux
    size(1600, 1400);
    const g = mk('g', {}); mainLogo(g); center(g, 1600, 1400);
  } else if (v === 'logo-blanc') {         // blanc sur bordeaux
    size(1600, 1400); page.classList.add('dark'); page.style.background = BDX;
    const g = mk('g', {}); mainLogo(g); center(g, 1600, 1400);
  } else if (v === 'monogramme') {         // photo de profil
    size(1080, 1080); page.classList.add('dark'); page.style.background = BDX;
    const g = mk('g', { transform: 'translate(540 540)' }); monogram(g, 400);
  } else if (v === 'monogramme-clair') {
    size(1080, 1080); page.style.background = '#FBF7F4';
    const g = mk('g', { transform: 'translate(540 540)' }); monogram(g, 400);
  } else if (v === 'carte') {              // carte de visite recto/verso
    size(1050, 1300); page.style.background = '#E9DFDA';
    const rect = (y, fill) => mk('rect', { x: 75, y, width: 900, height: 520, rx: 10, fill, filter: 'url(#sh)' });
    const d = mk('defs', {}); const f = mk('filter', { id: 'sh', x: '-10%', y: '-10%', width: '120%', height: '130%' }, d);
    mk('feDropShadow', { dx: 0, dy: 14, stdDeviation: 18, 'flood-color': '#3a0a12', 'flood-opacity': .22 }, f);
    rect(80, BDX); rect(700, '#FBF7F4');
    const g1 = mk('g', { class: 'dark' }); g1.style.setProperty('--ink', '#fff'); g1.style.setProperty('--line', 'rgba(255,255,255,.45)');
    mainLogo(g1); const b1 = g1.getBBox(); const s1 = 380 / b1.height;
    g1.setAttribute('transform', `translate(${525 - (b1.x + b1.width / 2) * s1} ${340 - (b1.y + b1.height / 2) * s1}) scale(${s1})`);
    const g2 = mk('g', { transform: 'translate(255 960)' }); monogram(g2, 150);
    const tx = (y, s, cls, txt, ls = 2) => mk('text', { x: 480, y, class: cls, 'font-size': s, 'letter-spacing': ls }, svg, txt);
    tx(900, 46, 'lau', 'By Lau', 1);
    tx(940, 20, 'sans', 'ENTREPRISE', 7);
    mk('line', { x1: 480, x2: 880, y1: 968, y2: 968, stroke: 'var(--line)' });
    tx(1010, 22, 'sans', 'WhatsApp  ·  votre numéro', 1);
    tx(1045, 22, 'sans', '@bylau  ·  votre ville', 1);
    tx(1092, 26, 'by', 'Bienvenue chez vous', 0);
  }
  window.READY = true;
});
</script>
</body></html>
