<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>By Lau — planche</title>
<style>
@font-face { font-family: Cormorant; src: url(fonts/cormorant-garamond-latin-500-italic.woff2); font-weight: 500; font-style: italic; }
@font-face { font-family: Josefin; src: url(fonts/josefin-sans-latin-300-normal.woff2); font-weight: 300; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 2400px; height: 1600px; overflow: hidden;
  background: radial-gradient(120% 90% at 40% 35%, #FBF4F1 0%, #EEDDD8 70%, #E4CEC8 100%); position: relative; font-family: Josefin; }
.it { position: absolute; box-shadow: 0 30px 50px rgba(70, 10, 25, .22), 0 6px 12px rgba(70, 10, 25, .12); }
img.it { display: block; }
.title { position: absolute; left: 70px; top: 54px; font-family: Cormorant; font-style: italic; font-size: 54px; color: #5A0A17; }
.title small { font-family: Josefin; font-style: normal; font-size: 18px; letter-spacing: 8px; display: block; margin-top: 4px; }
.lbl { position: absolute; font-size: 15px; letter-spacing: 5px; color: #7C3A47; text-transform: uppercase; }
svg.bag { position: absolute; overflow: visible; filter: drop-shadow(0 30px 30px rgba(70, 10, 25, .25)); }
</style></head><body>
<div class="title">By Lau<small>IDENTITÉ VISUELLE</small></div>
<img class="it" src="impression/by-lau-papier-de-soie.png" style="left:1540px; top:860px; width:700px; transform:rotate(-8deg); opacity:.95">
<img class="it" src="impression/by-lau-affiche-A3.png" style="left:110px; top:190px; width:600px">
<img class="it" src="impression/by-lau-carte-merci-recto.png" style="left:790px; top:230px; width:560px; transform:rotate(-4deg)">
<img class="it" src="impression/by-lau-carte-merci-verso.png" style="left:870px; top:640px; width:560px; transform:rotate(3deg)">
<img class="it" src="impression/by-lau-carte-visite-recto.png" style="left:790px; top:1090px; width:420px; transform:rotate(-6deg)">
<img class="it" src="impression/by-lau-carte-visite-verso.png" style="left:1090px; top:1180px; width:420px; transform:rotate(5deg)">
<svg class="bag" id="bag1" style="left:1500px; top:150px" width="440" height="640"></svg>
<svg class="bag" id="bag2" style="left:1960px; top:330px" width="330" height="470"></svg>
<img src="impression/by-lau-etiquette-ronde.png" style="position:absolute; left:1590px; top:1080px; width:190px; filter:drop-shadow(0 10px 12px rgba(70,10,25,.3))">
<img src="impression/by-lau-etiquette-merci.png" style="position:absolute; left:1830px; top:1250px; width:240px; transform:rotate(-7deg); filter:drop-shadow(0 10px 12px rgba(70,10,25,.3))">
<script>
const NS = 'http://www.w3.org/2000/svg';
const mk = (t, a, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
// sachet papier : face avant, soufflet, rabat, poignées en cordelette
function bag(svg, { w, h, body, side, top, handle, img, imgW, imgY, ribbon }) {
  const g = mk('g', {}, svg), sw = w * .16;
  mk('path', { d: `M ${w * .26} ${h * .2} C ${w * .26} ${-h * .02}, ${w * .62} ${-h * .02}, ${w * .62} ${h * .2}`, fill: 'none', stroke: handle, 'stroke-width': w * .025, 'stroke-linecap': 'round' }, g);
  mk('path', { d: `M ${w * .8} ${h * .16} L ${w * .9} ${h * .14} L ${w * .9} ${h * .975} L ${w * .8} ${h}`, fill: side }, g);
  mk('path', { d: `M ${w * .85} ${h * .15} L ${w * .85} ${h * .99}`, stroke: '#000', 'stroke-opacity': .12, 'stroke-width': 2 }, g);
  mk('rect', { x: 0, y: h * .16, width: w * .8, height: h * .84, fill: body }, g);
  mk('rect', { x: 0, y: h * .16, width: w * .8, height: h * .06, fill: top }, g);
  const sh = mk('linearGradient', { id: svg.id + 'g', x1: 0, x2: 1 }, mk('defs', {}, g));
  mk('stop', { offset: 0, 'stop-color': '#fff', 'stop-opacity': .12 }, sh); mk('stop', { offset: .5, 'stop-color': '#fff', 'stop-opacity': 0 }, sh); mk('stop', { offset: 1, 'stop-color': '#000', 'stop-opacity': .12 }, sh);
  mk('rect', { x: 0, y: h * .16, width: w * .8, height: h * .84, fill: `url(#${svg.id}g)` }, g);
  mk('path', { d: `M ${w * .3} ${h * .2} C ${w * .3} ${h * .02}, ${w * .66} ${h * .02}, ${w * .66} ${h * .2}`, fill: 'none', stroke: handle, 'stroke-width': w * .025, 'stroke-linecap': 'round' }, g);
  [w * .3, w * .66].forEach(x => mk('circle', { cx: x - (x > w * .5 ? 0 : 0), cy: h * .2, r: w * .014, fill: top }, g));
  if (ribbon) mk('path', { d: `M ${w * .4 - 30} ${h * .25} q 30 30 0 70 M ${w * .4 + 30} ${h * .25} q -30 30 0 70`, stroke: ribbon, 'stroke-width': 6, fill: 'none' }, g);
  mk('image', { href: img, x: (w * .8 - imgW) / 2, y: imgY, width: imgW }, g);
}
bag(document.getElementById('bag1'), { w: 440, h: 640, body: '#5A0A17', side: '#43060F', top: '#4A0812', handle: '#F3E3DF', img: 'impression/by-lau-sceau-encre-blanche.png', imgW: 250, imgY: 190 });
bag(document.getElementById('bag2'), { w: 330, h: 470, body: '#F7EFEC', side: '#E6D6D1', top: '#EFE2DE', handle: '#5A0A17', img: 'impression/by-lau-etiquette-ronde.png', imgW: 140, imgY: 200 });
Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => i.onload = i.onerror = r))).then(() => setTimeout(() => window.READY = true, 300));
</script>
</body></html>
