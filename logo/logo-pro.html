<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>By Lau — logo</title>
<style>
@font-face { font-family: Bodoni; src: url(fonts/bodoni-moda-latin-400-normal.woff2); font-weight: 400; }
@font-face { font-family: Cormorant; src: url(fonts/cormorant-garamond-latin-300-italic.woff2); font-weight: 300; font-style: italic; }
@font-face { font-family: Cormorant; src: url(fonts/cormorant-garamond-latin-500-italic.woff2); font-weight: 500; font-style: italic; }
@font-face { font-family: Josefin; src: url(fonts/josefin-sans-latin-300-normal.woff2); font-weight: 300; }
@font-face { font-family: Josefin; src: url(fonts/josefin-sans-latin-400-normal.woff2); font-weight: 400; }
html, body { margin: 0; background: transparent; }
svg { display: block; }
</style></head>
<body>
<svg id="s" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="brand.js"></script>
<script>
const q = new URLSearchParams(location.search);
const v = q.get('v') || 'presentation';
const s = document.getElementById('s');
const SZ = { presentation: [1080, 1350], logo: [1400, 1300], 'logo-blanc': [1400, 1300], carre: [1080, 1080], story: [1080, 1920], avant: [1080, 1350] }[v];
const [W, H] = SZ;
s.setAttribute('width', W); s.setAttribute('height', H); s.setAttribute('viewBox', `0 0 ${W} ${H}`);
const BD = '#5B0B19';

/* Logo affiné :
   - « by » en Cormorant italique 500 : graisse plus proche des pleins du Bodoni ;
   - « Lau » crénage optique (le « a » vient sous le bras du L) ;
   - « by » positionné sur une grille : jambe du y alignée sur le fût du « a » ;
   - filet vertical exactement de la hampe du b à la ligne de base, terminé par deux points ;
   - ENTREPRISE justifié sur la hauteur exacte du filet ;
   - arc concentrique à la panse du b, en capitales espacées. */
function logoPro(parent, color = BD, hair = 'rgba(91,11,25,.55)') {
  const g = mk('g', {}, parent);
  const F = 330;
  const lau = mk('text', { 'font-family': 'Bodoni', 'font-size': F, fill: color, x: 0, y: 0 }, g);
  mk('tspan', {}, lau, 'L');
  mk('tspan', { dx: -F * .085 }, lau, 'a');
  mk('tspan', { dx: -F * .012 }, lau, 'u');
  const lb = lau.getBBox();
  const by = mk('text', { 'font-family': 'Cormorant', 'font-style': 'italic', 'font-weight': 500, 'font-size': F * .98, fill: color, x: 0, y: 0 }, g);
  mk('tspan', {}, by, 'b');
  mk('tspan', { dx: -F * .01 }, by, 'y');
  // position de "by" : se termine au-dessus du "u", ligne de base posée juste au-dessus de la hauteur de capitale du L
  const capTop = lb.y + lb.height * .02;
  const bb0 = by.getBBox();
  const byX = lb.x + lb.width / 2 - bb0.width / 2 + F * (+(q.get('dx') ?? .18));
  const byY = capTop + F * (+(q.get('dy') ?? 0));           // la jambe du y plonge dans l'espace libre au-dessus du « a »
  by.setAttribute('x', byX); by.setAttribute('y', byY);
  const bb = by.getBBox();
  // filet
  const xr = lb.x + lb.width + F * .14;
  const top = bb.y + F * .06, base = 0;   // de la hampe du b à la ligne de base de Lau
  mk('line', { x1: xr, y1: top, x2: xr, y2: base, stroke: hair, 'stroke-width': 1.4 }, g);
  mk('circle', { cx: xr, cy: top - 9, r: 2.6, fill: color }, g);
  mk('circle', { cx: xr, cy: base + 9, r: 2.6, fill: color }, g);
  // ENTREPRISE justifié
  const vg = mk('g', { transform: `translate(${xr + F * .085} ${top}) rotate(90)` }, g);
  const ent = mk('text', { 'font-family': 'Josefin', 'font-weight': 400, 'font-size': F * .105, fill: color, x: 0, y: 0 }, vg, 'ENTREPRISE');
  const len = base - top, w0 = ent.getComputedTextLength();
  ent.setAttribute('letter-spacing', (len - w0) / 9.5);
  // arc concentrique à la panse du b
  const bBowlCx = bb.x + F * .2, bBowlCy = bb.y + bb.height * .47, r = bb.height * .62;
  const a0 = 196 * Math.PI / 180, a1 = 318 * Math.PI / 180;
  textOnPath(g, `M ${bBowlCx + r * Math.cos(a0)} ${bBowlCy + r * Math.sin(a0)} A ${r} ${r} 0 0 1 ${bBowlCx + r * Math.cos(a1)} ${bBowlCy + r * Math.sin(a1)}`,
    'BIENVENUE CHEZ VOUS', { size: F * .062, family: 'Josefin', weight: 400, spacing: F * .028, offset: '50%', anchor: 'middle', color });
  return g;
}

// fond « papier » très subtil
function paper(w, h, dark) {
  const defs = mk('defs', {}, s);
  const f = mk('filter', { id: 'grain', x: 0, y: 0, width: '100%', height: '100%' }, defs);
  mk('feTurbulence', { type: 'fractalNoise', baseFrequency: .9, numOctaves: 2, seed: 3 }, f);
  mk('feColorMatrix', { type: 'matrix', values: `0 0 0 0 ${dark ? 1 : .35}  0 0 0 0 ${dark ? 1 : .1}  0 0 0 0 ${dark ? 1 : .15}  0 0 0 ${dark ? .05 : .06} 0` }, f);
  const rg = mk('radialGradient', { id: 'pg', cx: '38%', cy: '38%', r: '85%' }, defs);
  mk('stop', { offset: 0, 'stop-color': dark ? '#6E1222' : '#FFFFFF' }, rg);
  mk('stop', { offset: 1, 'stop-color': dark ? '#3E0610' : '#F1E5E0' }, rg);
  mk('rect', { width: w, height: h, fill: 'url(#pg)' }, s);
  mk('rect', { width: w, height: h, filter: 'url(#grain)' }, s);
}

document.fonts.ready.then(() => {
  if (v === 'presentation') {
    paper(W, H, false);
    const bw = 108;
    mk('rect', { x: W - bw, width: bw, height: H, fill: BD }, s);
    // monogramme discret en bas de la bande
    const vt = mk('g', { transform: `translate(${W - bw / 2 + 6} ${H / 2}) rotate(90)` }, s);
    mk('text', { 'font-family': 'Josefin', 'font-weight': 300, 'font-size': 15, 'letter-spacing': 9, fill: '#fff', opacity: .75, 'text-anchor': 'middle', x: 0, y: 0 }, vt, 'BY LAU  —  ENTREPRISE');
    const g = logoPro(s); fitInto(g, (W - bw) / 2 + 6, H / 2, 640, 760);
  } else if (v === 'logo') {
    const g = logoPro(s); fitInto(g, W / 2, H / 2, 1000, 1000);
  } else if (v === 'logo-blanc') {
    paper(W, H, true);
    const g = logoPro(s, '#fff', 'rgba(255,255,255,.6)'); fitInto(g, W / 2, H / 2, 900, 900);
  } else if (v === 'carre') {
    paper(W, H, true);
    const g = logoPro(s, '#fff', 'rgba(255,255,255,.6)'); fitInto(g, W / 2, H / 2, 640, 640);
  } else if (v === 'story') {
    paper(W, H, true);
    const g = logoPro(s, '#fff', 'rgba(255,255,255,.6)'); fitInto(g, W / 2, H / 2, 700, 800);
  }
  window.READY = true;
});
</script>
</body></html>
